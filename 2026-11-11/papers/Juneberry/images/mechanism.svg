<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="390" viewBox="0 0 1160 390" role="img" aria-labelledby="title desc">
<title id="title">Juneberry 原创机制解读示意</title>
<desc id="desc">硬件 ACK、执行完成、持久化成功是不同事件；图中的顺序不构成通用正确性保证。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7a8896"/></marker></defs>
<rect width="1160" height="390" rx="16" fill="#fafbf9"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">
<text x="32" y="46" font-size="23" font-weight="700" fill="#182b40">Juneberry 的核心设计</text>
<text x="1126" y="45" text-anchor="end" font-size="17" fill="#657482">原创概念示意 · 非论文原图</text>
<path d="M280 173 L309 173" fill="none" stroke="#7a8896" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="91" width="248" height="168" rx="10" fill="#e9eff7"/>
<text x="51" y="123" font-size="16" fill="#617280">01</text>
<path d="M562 173 L591 173" fill="none" stroke="#7a8896" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="314" y="91" width="248" height="168" rx="10" fill="#e6f3ee"/>
<text x="333" y="123" font-size="16" fill="#617280">02</text>
<path d="M844 173 L873 173" fill="none" stroke="#7a8896" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="596" y="91" width="248" height="168" rx="10" fill="#edf0fb"/>
<text x="615" y="123" font-size="16" fill="#617280">03</text>
<rect x="878" y="91" width="248" height="168" rx="10" fill="#fbf0e5"/>
<text x="897" y="123" font-size="16" fill="#617280">04</text>
<text x="32" y="307" font-size="18" fill="#43576b">硬件 ACK、执行完成、持久化成功是不同事件；图中的顺序不构成通用正确性保证。</text>
<text x="51" y="157" font-size="20" font-weight="600" fill="#182b40">客户端提交 RDMA</text><text x="51" y="185" font-size="20" font-weight="600" fill="#182b40">SEND</text><text x="51" y="217" font-size="16" fill="#43576b">仅适用于一类特定请求</text><text x="333" y="157" font-size="20" font-weight="600" fill="#182b40">RNIC 接收并硬件 ACK</text><text x="333" y="217" font-size="16" fill="#43576b">客户端提交路径缩短</text><text x="615" y="157" font-size="20" font-weight="600" fill="#182b40">服务端 CPU 顺序执行</text><text x="615" y="217" font-size="16" fill="#43576b">CPU 工作仍然存在</text><text x="897" y="157" font-size="20" font-weight="600" fill="#182b40">持久化与错误语义</text><text x="897" y="217" font-size="16" fill="#43576b">需额外机制或回退处理</text></g></svg>