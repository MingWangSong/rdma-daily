<text x="32" y="307" font-size="18" fill="#43576b">这是职责划分示意，不是完整协议；优化关注瓶颈节点承受的 RDMA 操作数。</text>
<text x="51" y="157" font-size="20" font-weight="600" fill="#182b40">计算节点缓存</text><text x="51" y="217" font-size="16" fill="#43576b">保留定位所需的信息</text><text x="333" y="157" font-size="20" font-weight="600" fill="#182b40">分布 fingerprint 与叶锁</text><text x="333" y="217" font-size="16" fill="#43576b">分散远端热点操作</text><text x="615" y="157" font-size="20" font-weight="600" fill="#182b40">内存节点的连续叶节点</text><text x="615" y="217" font-size="16" fill="#43576b">保留范围扫描能力</text><text x="897" y="157" font-size="20" font-weight="600" fill="#182b40">版本校验与副本修正</text><text x="897" y="217" font-size="16" fill="#43576b">处理缓存信息变化</text></g></svg>