<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="390" viewBox="0 0 1160 390" role="img" aria-labelledby="title desc">
<title id="title">FineMem 原创机制解读示意</title>
<desc id="desc">后台 CPU 仍参与 rkey 再生成与恢复；它不是内存节点复制或完整缓存一致性方案。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7a8896"/></marker></defs>
<rect width="1160" height="390" rx="16" fill="#fafbf9"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">
<text x="32" y="46" font-size="23" font-weight="700" fill="#182b40">FineMem 的核心设计</text>
<text x="1126" y="45" text-anchor="end" font-size="17" fill="#657482">原创概念示意 · 非论文原图</text>
<rect x="32" y="91" width="248" height="168" rx="10" fill="#e9eff7"/>
<text x="51" y="123" font-size="16" fill="#617280">01</text>
<rect x="314" y="91" width="248" height="168" rx="10" fill="#e6f3ee"/>
