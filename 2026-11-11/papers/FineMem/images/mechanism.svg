<rect x="596" y="91" width="248" height="168" rx="10" fill="#edf0fb"/>
<text x="615" y="123" font-size="16" fill="#617280">03</text>
<rect x="878" y="91" width="248" height="168" rx="10" fill="#fbf0e5"/>
<text x="897" y="123" font-size="16" fill="#617280">04</text>
<text x="32" y="307" font-size="18" fill="#43576b">后台 CPU 仍参与 rkey 再生成与恢复；它不是内存节点复制或完整缓存一致性方案。</text>
<text x="51" y="157" font-size="20" font-weight="600" fill="#182b40">预注册 Memory</text><text x="51" y="185" font-size="20" font-weight="600" fill="#182b40">Region</text><text x="51" y="217" font-size="16" fill="#43576b">减少按需注册开销</text><text x="333" y="157" font-size="20" font-weight="600" fill="#182b40">两层 bitmap 与 CAS</text><text x="333" y="217" font-size="16" fill="#43576b">执行细粒度分配</text><text x="615" y="157" font-size="20" font-weight="600" fill="#182b40">Memory Window 与</text><text x="615" y="185" font-size="20" font-weight="600" fill="#182b40">rkey</text><text x="615" y="217" font-size="16" fill="#43576b">约束细粒度访问权限</text><text x="897" y="157" font-size="20" font-weight="600" fill="#182b40">后台管理与日志恢复</text><text x="897" y="217" font-size="16" fill="#43576b">回收和计算节点故障处理</text></g></svg>