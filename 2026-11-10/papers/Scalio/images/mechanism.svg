<text x="32" y="307" font-size="18" fill="#43576b">四个框表示设计责任，并非一条串行路径；前三者的并发由缓存协议约束。</text>
<text x="51" y="157" font-size="20" font-weight="600" fill="#182b40">读请求查缓存</text><text x="51" y="217" font-size="16" fill="#43576b">热数据用 one-sided RDMA</text><text x="333" y="157" font-size="20" font-weight="600" fill="#182b40">未命中读取 SSD</text><text x="333" y="217" font-size="16" fill="#43576b">NVMe-oF target offload</text><text x="615" y="157" font-size="20" font-weight="600" fill="#182b40">并发写仍经目标 CPU</text><text x="615" y="217" font-size="16" fill="#43576b">写入与缓存更新协同</text><text x="897" y="157" font-size="20" font-weight="600" fill="#182b40">状态与 CAS 协议</text><text x="897" y="217" font-size="16" fill="#43576b">协调 refill · 写入 · 失效</text></g></svg>